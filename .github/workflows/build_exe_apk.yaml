name: build exe and apk

# action事件触发
on:
  workflow_dispatch:

# 可以有多个jobs
jobs:
    build_apk_and_windows:
        runs-on: windows-latest
        permissions:
          contents: write

        steps:
            - name: 代码迁出
              uses: actions/checkout@v4

            - name: 构建Java环境
              uses: actions/setup-java@v4
              with:
                  distribution: "zulu"
                  java-version: "17"

            - name: 安装 Android SDK
              uses: android-actions/setup-android@v3

            - name: 安装Flutter
              uses: subosito/flutter-action@v2
              with:
                  flutter-version: '3.41.7'
                  channel: stable

            - name: 启用 Windows 桌面支持
              run: flutter config --enable-windows-desktop

            - name: 下载项目依赖
              run: flutter pub get

            - name: 解码生成 key.properties
              run: |
                  $bytes = [Convert]::FromBase64String($env:KEY_PROPERTIES)
                  [IO.File]::WriteAllBytes("android/key.properties", $bytes)
              env:
                KEY_PROPERTIES: ${{ secrets.KEY_PROPERTIES }}

            - name: 解码生成 jks
              run: |
                  $bytes = [Convert]::FromBase64String($env:KEYSTORE_BASE64)
                  [IO.File]::WriteAllBytes("android/app/release.jks", $bytes)
              env:
                  KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

            - name: flutter build apk
              run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info

            - name: flutter build windows
              run: flutter build windows --release --obfuscate --split-debug-info=build/debug-info

            - name: 打包 Windows 产物
              run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath GeoChef-windows-x64.zip

            - name: 发布
              uses: ncipollo/release-action@v1
              with:
                  artifacts: "build/app/outputs/flutter-apk/app-*.apk,GeoChef-windows-x64.zip"
                  allowUpdates: true